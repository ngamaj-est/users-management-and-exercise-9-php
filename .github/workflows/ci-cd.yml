name: CI/CD Pipeline (Cloud Database)

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Calidad de Código y Validación de Sintaxis PHP
  # ============================================================================
  code-quality:
    name: PHP Lint & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, mbstring, bcmath
          coverage: none

      - name: Validar archivo .env.example
        run: |
          if [ ! -f .env.example ]; then
            echo "ERROR: El archivo .env.example no existe en la raíz del proyecto."
            exit 1
          fi
          echo ".env.example verificado correctamente."

      - name: Comprobar sintaxis PHP (php -l) en todo el código
        run: |
          echo "Iniciando verificación de sintaxis PHP..."
          error_count=0
          for file in $(find . -type f -name "*.php"); do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "Error de sintaxis detectado en: $file"
              php -l "$file"
              error_count=$((error_count + 1))
            fi
          done

          if [ $error_count -ne 0 ]; then
            echo "Se encontraron $error_count archivo(s) con errores de sintaxis."
            exit 1
          fi
          echo "Todos los archivos PHP tienen sintaxis válida."

  # ============================================================================
  # 2. Construcción y Verificación del Contenedor Docker
  # ============================================================================
  docker-build-and-test:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar sintaxis de docker-compose.yml
        run: |
          docker compose config

      - name: Construir imagen Docker de la aplicación
        run: |
          docker build -t app-users-enfermedades:latest .

      - name: Probar arranque del contenedor en entorno aislado
        run: |
          # Iniciar contenedor pasando variables simuladas para verificar que Apache y PHP arranquen
          docker run -d \
            --name app_test \
            -p 8080:80 \
            -e DB_HOST=cloud-db.dummy.host \
            -e DB_PORT=3306 \
            -e DB_DATABASE=Enfermedades_db \
            -e DB_USERNAME=dummy_user \
            -e DB_PASSWORD=dummy_pass \
            -e DB_SSL=true \
            app-users-enfermedades:latest

          echo "Esperando inicio del servidor web Apache..."
          sleep 5

          docker ps --filter "name=app_test"

      - name: Probar conectividad HTTP al servidor web
        run: |
          echo "Consultando respuesta del servidor web Apache..."
          max_retries=10
          count=0
          until curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ | grep -q -E "200|302|301"; do
            count=$((count+1))
            if [ $count -ge $max_retries ]; then
              echo "El servidor web no respondió con código esperado después de $max_retries intentos."
              docker logs app_test
              exit 1
            fi
            echo "Reintentando conexión ($count/$max_retries)..."
            sleep 2
          done
          echo "Servidor Apache y la aplicación respondieron correctamente en el puerto 8080."

      - name: Limpiar contenedor de prueba
        if: always()
        run: |
          docker rm -f app_test || true

  # ============================================================================
  # 3. Despliegue Continuo (CD) hacia Entorno Productivo
  # ============================================================================
  deploy:
    name: Continuous Deployment (CD)
    runs-on: ubuntu-latest
    needs: docker-build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Resumen de Despliegue
        run: |
          echo "Despliegue iniciado para el commit ${{ github.sha }} en la rama ${{ github.ref_name }}."
          echo "La aplicación se conectará a la Base de Datos Cloud configurada mediante variables de entorno."

      # Ejemplo para despliegue automatizado en servicios como Render, Railway, AWS ECS o VPS mediante webhook / SSH:
      # - name: Disparar webhook de despliegue
      #   if: env.DEPLOY_WEBHOOK_URL != ''
      #   run: |
      #     curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
